<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendas da Algoritmia</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 255, 100, 0.25);
            border: 2px solid #333;
            text-align: center;
        }

        .active { display: flex; }

        /* 1. Tela Inicial Principal */
        .title-screen h1 {
            font-size: 2.8rem;
            color: #4CAF50;
            text-shadow: 0 0 15px rgba(76, 175, 80, 0.7);
            margin-bottom: 10px;
        }

        .title-screen p {
            color: #aaa;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .btn-main {
            font-size: 1.3rem;
            padding: 14px 28px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-main:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #66BB6A, #388E3C);
        }

        /* 2. Tela de Criação */
        .color-picker {
            display: flex;
            gap: 12px;
            margin: 15px 0 25px 0;
        }

        .color-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-btn.selected {
            border: 4px solid #FFD700;
            transform: scale(1.15);
        }

        input[type="text"] {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #4CAF50;
            background: #222;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
        }

        /* 3. Canvas e Tela de Jogo */
        canvas {
            border: 3px solid #4CAF50;
            background-color: #050505;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        .ui-panel {
            width: 800px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .card {
            background: #222;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            flex: 1;
        }

        .inventory-panel {
            width: 800px;
            margin-top: 12px;
            background: #222;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: left;
        }

        .inventory-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .item-card {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #333;
            padding: 6px 10px;
            border-radius: 6px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 14px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
        }

        button:hover { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .btn-discard { background-color: #e53935; padding: 4px 8px; font-size: 12px; }
        .btn-discard:hover { background-color: #c62828; }
        .btn-danger { background-color: #f44336; }
        .btn-danger:hover { background-color: #d32f2f; }
    </style>
</head>
<body>

    <!-- 1. TELA DE TÍTULO PRINCIPAL -->
    <div id="titleScreen" class="screen title-screen active">
        <h1>⚔️ Lendas da Algoritmia 🛡️</h1>
        <p>Aventuras em Turnos no Reino dos Canvas</p>
        <button class="btn-main" onclick="irParaCriacao()">Começar Aventura</button>
    </div>

    <!-- 2. TELA DE CRIAÇÃO DO PERSONAGEM -->
    <div id="startScreen" class="screen">
        <h2>Criar Seu Herói</h2>
        
        <label>Nome do Personagem:</label>
        <input type="text" id="playerNameInput" placeholder="Ex: Eldrin" maxlength="12" value="Herói">

        <label>Escolha a Cor do seu Guerreiro:</label>
        <div class="color-picker" id="colorPicker"></div>

        <button class="btn-main" onclick="iniciarJogo()">Entrar no Mundo</button>
    </div>

    <!-- 3. TELA DE JOGO -->
    <div id="gameScreen" class="screen">
        <h2>Fase <span id="stageNum">1</span> | Nível <span id="heroLvl">1</span> (<span id="heroXp">0</span>/100 XP)</h2>
        <canvas id="gameCanvas" width="800" height="350"></canvas>

        <div class="ui-panel">
            <div class="card" style="text-align: left;">
                <p><strong><span id="heroNameDisplay">Herói</span></strong></p>
                <p>HP: <span id="heroHp">110</span>/<span id="heroMaxHp">110</span></p>
                <p>Ataque: <span id="heroAtk">22</span></p>
            </div>

            <div class="card" style="text-align: center;">
                <div id="actionButtons">
                    <button id="btnAttack" onclick="atacarInimigo()">Atacar Inimigo</button>
                </div>
            </div>

            <div class="card" style="text-align: left;">
                <p><strong>Inimigos da Fase:</strong></p>
                <div id="enemiesStatus"></div>
            </div>
        </div>

        <!-- Inventário -->
        <div class="inventory-panel">
            <strong>🎒 Inventário:</strong>
            <div id="inventoryList" class="inventory-list"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
